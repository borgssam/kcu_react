<!-- index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - HTML 버전</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-card">
    <h2 class="login-title">kcu 로그인</h2>
    <form action="#" id="loginForm">
      <div class="form-group">
        <label class="form-group" for="userId">아이디</label>
        <input type="text" class="form-input" id="userId" required />            
      </div>
      <div class="form-group">
        <label class="form-level" for="userPw">비밀번호</label>
        <input type="password" class="form-input" id="userPw" required />
      </div>
      <button type="submit" class="btn-submit">로그인</button>
    </form>
    <p class="message" id="message">알림메시지</p>
  </div>
  

    <script>
      const form = document.getElementById('loginForm');
      const message = document.getElementById('message');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        // 로그인 로직 구현
        const id = document.getElementById('userId').value;
        const pw = document.getElementById('userPw').value;
        alert(`아이디: ${id}, 비밀번호: ${pw}`);

        if(pw === '1234') {
          message.textContent = `성공: ${id}님 환영합니다`;
          message.style.color = 'green';
        } else {
          message.textContent = '로그인 실패';
          message.style.color = 'red';
        }
      });
    </script>
</body>
</html>
